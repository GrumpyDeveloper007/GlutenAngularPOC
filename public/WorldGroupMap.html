<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Gluten Free Facebook Groups - World Map</title>
  <meta property="og:title" content="Dales Gluten Free Map - World Group Map">
  <meta property="og:image" content="https://www.dalesgfmap.com/favicon.ico">
  <meta property="og:description" content="Explore gluten-free Facebook groups around the world">
  <meta name="description" content="Explore gluten-free Facebook groups around the world">
  <meta name="keywords" content="Gluten Free, Coeliac, Celiac, Facebook Groups, World Map">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root {
      color-scheme: light;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
      background: #f4f4f4;
      --theme-green: #4CAF50;
      --theme-green-dark: #388e3c;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: inherit;
      color: inherit;
      background: #f4f4f4;
    }

    #page-header {
      flex: 0 0 auto;
      padding: 5px;
      background: var(--theme-green);
      color: #fff;
      font-size: 0.8em;
      text-align: center;
    }

    #map {
      flex: 1;
      width: 100%;
      min-height: 0;
    }

    .group-label-icon {
      width: max-content !important;
      height: auto !important;
      border: 0;
      background: transparent;
      white-space: nowrap;
    }

    .group-label {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 9px;
      border: 1px solid var(--theme-green);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.96);
      color: #333;
      font: 500 12px/1.4 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      white-space: nowrap;
      text-decoration: none;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      transform: translate(-50%, calc(-50% + var(--label-offset, 0px)));
      transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .group-label:hover,
    .group-label:focus-visible {
      border-color: var(--theme-green-dark);
      background: #f1f8f1;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      color: var(--theme-green-dark);
      text-decoration: none;
    }

    .group-label:focus-visible {
      outline: 2px solid var(--theme-green-dark);
      outline-offset: 2px;
    }

    .leaflet-bar {
      border: 1px solid rgba(0, 0, 0, 0.16) !important;
      border-radius: 6px !important;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2) !important;
      overflow: hidden;
    }

    .leaflet-bar a,
    .leaflet-bar a:hover {
      color: #333;
    }

    .leaflet-bar a:hover {
      background: #f1f8f1;
      color: var(--theme-green-dark);
    }

    #message {
      position: absolute;
      z-index: 1000;
      top: 40px;
      left: 50%;
      display: none;
      max-width: calc(100% - 48px);
      padding: 8px 12px;
      transform: translateX(-50%);
      border: 1px solid #f1b8b8;
      border-radius: 6px;
      background: #fff;
      color: #7f0000;
      font: 14px/1.4 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    @media (prefers-reduced-motion: reduce) {
      .group-label {
        transition: none;
      }
    }

    @media (min-width: 1024px) {
      #page-header {
        font-size: 1em;
      }
    }
  </style>
</head>

<body>
  <header id="page-header">Dales Gluten-free Map (FB Group Indexer) - World Group Map</header>
  <div id="map" aria-label="Scrollable map showing group boundaries and labels"></div>
  <div id="message" role="alert"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const map = L.map('map', { scrollWheelZoom: true }).setView([20, 0], 2);
    const groupLayer = L.featureGroup().addTo(map);
    const message = document.getElementById('message');

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      noWrap: true,
    }).addTo(map);

    function showError(text) {
      message.textContent = text;
      message.style.display = 'block';
    }

    function isCoordinate(value, minimum, maximum) {
      return typeof value === 'number' && Number.isFinite(value)
        && value >= minimum && value <= maximum;
    }

    async function loadGroups() {
      const response = await fetch('/groups.json');
      //const response = await fetch('https://thegfshire.azurewebsites.net/api/Groups');
      if (!response.ok) {
        throw new Error(`Could not load groups from the API (HTTP ${response.status}).`);
      }

      const groups = await response.json();
      if (!Array.isArray(groups)) {
        throw new Error('The groups API must return an array of group records.');
      }

      const labelsByLocation = new Map();
      groups.forEach((group, index) => {
        const label = typeof group?.name === 'string' ? group.name.trim() : '';
        const { geoLongitudeMin: west, geoLatitudeMin: south, geoLongitudeMax: east, geoLatitudeMax: north } = group ?? {};
        //const { GeoLongitudeMin: west, GeoLatitudeMin: south, GeoLongitudeMax: east, GeoLatitudeMax: north } = group ?? {};

        if ([west, south, east, north].some((coordinate) => coordinate == null)) {
          return;
        }

        // The API uses zero bounds for groups without a mapped location.
        if (west === 0 && south === 0 && east === 0 && north === 0) {
          return;
        }

        if (!label || !isCoordinate(west, -180, 180) || !isCoordinate(east, -180, 180)
          || !isCoordinate(south, -90, 90) || !isCoordinate(north, -90, 90)
          || west >= east || south >= north) {
          return;
          //throw new Error(`Group record ${index + 1} needs a name and valid geographic bounds.`);
        }

        const groupId = typeof group?.groupId === 'string' ? group.groupId.trim() : '';
        if (!groupId) {
          throw new Error(`Group record ${index + 1} needs a GroupId.`);
        }

        const labelElement = document.createElement('a');
        labelElement.className = 'group-label';
        labelElement.href = `https://www.facebook.com/groups/${encodeURIComponent(groupId)}`;
        labelElement.target = '_blank';
        labelElement.rel = 'noopener noreferrer';

        const visibilityIcon = document.createElement('span');
        visibilityIcon.setAttribute('aria-hidden', 'true');
        if (group.publicGroup === true) {
          visibilityIcon.textContent = '🌐';
          visibilityIcon.title = 'Public group';
        } else if (group.publicGroup === false) {
          visibilityIcon.textContent = '🔒';
          visibilityIcon.title = 'Private group';
        }
        labelElement.append(visibilityIcon, document.createTextNode(`${label} (${group.totalPins})`));

        const latitude = (south + north) / 2;
        const longitude = (west + east) / 2;
        const locationKey = `${latitude},${longitude}`;
        if (!labelsByLocation.has(locationKey)) {
          labelsByLocation.set(locationKey, []);
        }
        labelsByLocation.get(locationKey).push({ labelElement, latitude, longitude, label });
      });

      labelsByLocation.forEach((labels) => {
        labels.sort((first, second) => first.label.localeCompare(second.label));
        labels.forEach(({ labelElement, latitude, longitude }, index) => {
          const labelOffset = (index - (labels.length - 1) / 2) * 34;
          labelElement.style.setProperty('--label-offset', `${labelOffset}px`);

          const labelIcon = L.divIcon({
            className: 'group-label-icon',
            html: labelElement,
            iconSize: null,
            iconAnchor: [0, 0],
          });
          L.marker([latitude, longitude], { icon: labelIcon }).addTo(groupLayer);
        });
      });

      if (groupLayer.getLayers().length > 0) {
        map.fitBounds(groupLayer.getBounds(), { padding: [36, 36] });
      }
    }

    loadGroups().catch((error) => {
      console.error('Unable to display groups:', error);
      showError(error instanceof Error ? error.message : 'Unable to display groups.');
    });
  </script>
</body>

</html>
